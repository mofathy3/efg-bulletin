<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EFG Hermes Technical Bulletin</title>
<script>
async function openReport(){
  function formatDate(date){
    const yyyy = date.getFullYear();
    const m = date.getMonth() + 1;  // no leading zero
    const d = date.getDate();       // no leading zero
    const mm = String(m).padStart(2, '0');
    const dd = String(d).padStart(2, '0');
    return { yyyy, m, d, mm, dd, display: `${dd}-${mm}-${yyyy}` };
  }

  const base = "https://cdn.efghermes.com/Retail/Technical%20Bulletin%20Report";
  const today = new Date();
  const tFmt = formatDate(today);

  const input = prompt("Enter the report date (D-M-YYYY):", `${tFmt.d}-${tFmt.m}-${tFmt.yyyy}`);

  if (input) {
    const [d, m, yyyy] = input.split('-');
    // Build URL with unpadded day/month in path but padded in filename
    const dd = String(d).padStart(2, '0');
    const mm = String(m).padStart(2, '0');
    const urlManual = `${base}/${yyyy}/${m}/${d}/0/THE%20TECHNICAL%20BULLETIN%20${dd}-${mm}-${yyyy}.pdf`;
    location.href = urlManual;
  }
}
</script>
</head>
<body onload="openReport()">
  <h2 style="text-align:center; margin-top:40px;">
    Opening the selected EFG Hermes Technical Bulletin...
  </h2>
</body>
</html>
